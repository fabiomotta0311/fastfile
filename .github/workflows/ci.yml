name: CI

on:
  push:
    branches: [ "main" ]
  # PRs in a stack target feature branches, not just main.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, check, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Release regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test release version handling
        run: python3 .github/scripts/test_release_version.py
      - name: Agent benchmark corpus and evaluator (offline)
        run: |
          python3 bench/agentes/corpus.py verificar
          python3 -m unittest discover -s bench/agentes/tests -v

      - name: Test installer in extracted release archive
        run: bash .github/scripts/test_installer_tar.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --locked

      - name: Cargo test
        run: cargo test --workspace --locked

  macos:
    name: macOS (clippy, check, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --locked

      - name: Cargo test
        run: cargo test --workspace --locked

  windows:
    name: Windows (clippy, check, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sem FF_BENCH_DOCKER_IMAGE: só os testes que não executam código candidato.
      # PYTHONUTF8=0 mantém a codificação padrão do Windows, para pegar leitura de texto sem encoding.
      - name: Agent benchmark corpus and evaluator (offline)
        env:
          PYTHONUTF8: "0"
        run: |
          python bench/agentes/corpus.py verificar
          python -m unittest discover -s bench/agentes/tests -v

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --locked

      - name: Cargo test
        run: cargo test --workspace --locked

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
