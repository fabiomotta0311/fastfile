name: Fuzz

# Exploração longa guiada por cobertura (libFuzzer). Os testes de robustez determinísticos em
# `crates/*/tests/*_robustness.rs` já rodam no CI normal; este job procura o que eles não alcançam.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Duração por alvo (s)"
        default: "120"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [snapshot_load, usn_buffer, mft_record, mft_layout, docx_xml, docx_zip, pdf, query_parse, ipc_request]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
        working-directory: .
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
