name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: v0.2.0 ou 0.2.0)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  get-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            CLEAN_VER="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CLEAN_VER="${GITHUB_REF#refs/tags/}"
          else
            CLEAN_VER=$(python3 -c "import tomllib; f=open('Cargo.toml','rb'); print(tomllib.load(f)['workspace']['package']['version'])")
          fi
          CLEAN_VER="${CLEAN_VER#v}"
          if [[ ! "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${CLEAN_VER} (Tag: v${CLEAN_VER})"

  build-release:
    name: Build (${{ matrix.target }})
    needs: get-version
    runs-on: ${{ matrix.os }}
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            use_tar: true
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            use_tar: true
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x86_64
            use_tar: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            use_tar: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Assinatura Authenticode (opcional): só roda se o segredo WINDOWS_CERT_PFX_BASE64 existir.
      # Sem ele, a release continua sendo publicada, apenas sem assinatura (ver docs/assinatura.md).
      - name: Sign Windows binaries (Authenticode)
        if: ${{ !matrix.use_tar && env.HAS_SIGNING_CERT == 'true' }}
        shell: powershell
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          $dir = "target/${{ matrix.target }}/release"
          $files = "ff.exe", "fastfile.exe", "ff-ui.exe", "ff-indexer.exe" | ForEach-Object { Join-Path $dir $_ }
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "FastFile" $files
          if ($LASTEXITCODE -ne 0) { Remove-Item $pfx -Force; exit 1 }
          foreach ($f in $files) { & $signtool verify /pa $f; if ($LASTEXITCODE -ne 0) { Remove-Item $pfx -Force; exit 1 } }
          Remove-Item $pfx -Force

      # Empacotamento Unix (Linux / macOS)
      - name: Package artifacts (Linux / macOS)
        if: matrix.use_tar
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          STAGE_DIR="dist_stage"
          mkdir -p "$STAGE_DIR"

          # Copia binários
          cd "target/${{ matrix.target }}/release"
          cp ff fastfile ../../../"$STAGE_DIR/"
          [ -f ff-ui ] && cp ff-ui ../../../"$STAGE_DIR/" || true
          [ -f ff-indexer ] && cp ff-indexer ../../../"$STAGE_DIR/" || true
          cd ../../../

          # Copia scripts e documentação
          mkdir -p "$STAGE_DIR/scripts"
          cp scripts/install.sh "$STAGE_DIR/scripts/"
          cp scripts/install.sh "$STAGE_DIR/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE_DIR/"

          # Metadados de desktop no Linux
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p "$STAGE_DIR/packaging/linux" "$STAGE_DIR/assets"
            cp packaging/linux/fastfile.desktop "$STAGE_DIR/packaging/linux/" || true
            cp assets/fastfile.* "$STAGE_DIR/assets/" || true
          fi

          # Gera arquivos tar.gz genérico e versionado
          tar -czf "fastfile-${{ matrix.platform }}.tar.gz" -C "$STAGE_DIR" .
          cp "fastfile-${{ matrix.platform }}.tar.gz" "fastfile-v${VERSION}-${{ matrix.platform }}.tar.gz"

      # Empacotamento Windows
      - name: Package artifacts (Windows)
        if: "!matrix.use_tar"
        shell: powershell
        run: |
          $VERSION = "${{ needs.get-version.outputs.version }}"
          $StageDir = "dist_stage"
          New-Item -ItemType Directory -Path "$StageDir\scripts", "$StageDir\assets" -Force | Out-Null

          # Copia binários
          $TargetDir = "target/${{ matrix.target }}/release"
          Copy-Item "$TargetDir\ff.exe", "$TargetDir\fastfile.exe", "$TargetDir\ff-ui.exe", "$TargetDir\ff-indexer.exe" -Destination $StageDir -Force

          # Copia scripts de instalação e desinstalação (na subpasta scripts e na raiz para máxima conveniência)
          Copy-Item "scripts\install.ps1", "scripts\uninstall.ps1" -Destination "$StageDir\scripts" -Force
          Copy-Item "scripts\install.ps1", "scripts\uninstall.ps1" -Destination $StageDir -Force

          # Copia ícone e metadados
          Copy-Item "assets\fastfile.ico" -Destination "$StageDir\assets\fastfile.ico" -Force
          Copy-Item "assets\fastfile.ico" -Destination "$StageDir\fastfile.ico" -Force
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $StageDir -Force

          # Gera os pacotes ZIP genérico e versionado preservando subpastas
          Push-Location $StageDir
          if (Get-Command tar -ErrorAction SilentlyContinue) {
            tar -a -cf "..\fastfile-windows-x86_64.zip" *
          } else {
            Compress-Archive -Path (Get-ChildItem -Force) -DestinationPath "..\fastfile-windows-x86_64.zip" -Force
          }
          Pop-Location
          Copy-Item "fastfile-windows-x86_64.zip" "fastfile-v$VERSION-windows-x86_64.zip" -Force

      - name: Build Inno Setup Installer (Windows)
        if: "!matrix.use_tar"
        shell: powershell
        run: |
          choco install innosetup --no-progress
          # Prepara target/release para o script do Inno Setup
          New-Item -ItemType Directory -Path "target\release" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release\*.exe" "target\release\" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/fastfile.iss
          if (Test-Path "target\installer\FastFile-Setup.exe") {
            Copy-Item "target\installer\FastFile-Setup.exe" "FastFile-Setup.exe" -Force
          }

      - name: Sign installer (Authenticode)
        if: ${{ !matrix.use_tar && env.HAS_SIGNING_CERT == 'true' }}
        shell: powershell
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "FastFile Setup" FastFile-Setup.exe
          if ($LASTEXITCODE -ne 0) { Remove-Item $pfx -Force; exit 1 }
          & $signtool verify /pa FastFile-Setup.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code -ne 0) { exit 1 }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            *.tar.gz
            *.zip
            *.exe
          if-no-files-found: error

  test-clean-install-windows:
    name: Test Clean Install (Windows)
    needs: [get-version, build-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-windows-x86_64
          path: downloaded

      - name: Run Clean Machine Install and Uninstall Verification
        shell: powershell
        run: |
          $zipPath = Get-ChildItem -Path downloaded -Filter "*.zip" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Testando pacote extraído: $zipPath"

          $extractDir = "$env:TEMP\clean_test_extract"
          $installDir = "$env:TEMP\clean_test_install"

          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          # 1. Verifica presença de scripts/install.ps1
          $script = Join-Path $extractDir "scripts\install.ps1"
          if (-not (Test-Path $script)) {
            Write-Error "FALHA: scripts/install.ps1 ausente no ZIP distribuído!"
            exit 1
          }

          # 2. Executa instalação limpa
          & "$script" -InstallDir $installDir -NoContextMenu -NoPath

          # 3. Valida executáveis instalados
          $ffExe = Join-Path $installDir "ff.exe"
          $fastfileExe = Join-Path $installDir "fastfile.exe"
          if (-not (Test-Path $ffExe) -or -not (Test-Path $fastfileExe)) {
            Write-Error "FALHA: Binários não foram instalados em $installDir!"
            exit 1
          }

          & "$ffExe" --version
          $json = & "$ffExe" find . --limit 1 --compact
          Write-Host "Saída do find: $json"
          if ($json -notmatch '"schema"\s*:\s*"ff/1"') {
            Write-Error "FALHA: Resposta do ff não possui contrato schema ff/1!"
            exit 1
          }

          # 4. Executa desinstalação
          $uninstallScript = Join-Path $installDir "uninstall.ps1"
          & "$uninstallScript" -InstallDir $installDir
          Start-Sleep -Seconds 1
          if (Test-Path (Join-Path $installDir "ff.exe")) {
            Write-Error "FALHA: Arquivos continuam presentes após desinstalação!"
            exit 1
          }
          Write-Host "Validação de instalação em máquina limpa concluída com sucesso!"

  test-clean-install-linux:
    name: Test Clean Install (Linux)
    needs: [get-version, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-linux-x86_64
          path: downloaded

      - name: Run Clean Install Verification
        run: |
          TAR_FILE=$(find downloaded -name "*.tar.gz" | head -n 1)
          EXTRACT_DIR="/tmp/clean_test_linux"
          INSTALL_DIR="/tmp/clean_install_bin"
          mkdir -p "$EXTRACT_DIR" "$INSTALL_DIR"
          tar -xzf "$TAR_FILE" -C "$EXTRACT_DIR"

          # Valida presença de install.sh
          test -f "$EXTRACT_DIR/scripts/install.sh"
          test -f "$EXTRACT_DIR/ff"
          test -f "$EXTRACT_DIR/fastfile"

          # Executa instalação
          cd "$EXTRACT_DIR"
          INSTALL_DIR="$INSTALL_DIR" ./scripts/install.sh

          # Valida binários instalados
          "$INSTALL_DIR/ff" --version
          JSON_RES=$("$INSTALL_DIR/ff" find . --limit 1 --compact)
          echo "Saída JSON: $JSON_RES"
          echo "$JSON_RES" | grep '"schema":"ff/1"'
          echo "Validação Linux concluída com sucesso!"

  publish-release:
    name: Publish Release and Manifests
    needs: [get-version, build-release, test-clean-install-windows, test-clean-install-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # identidade OIDC para a attestation
      attestations: write  # grava a attestation no repositório
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-artifacts

      - name: Consolidate Artifacts and Generate Manifests & Checksums
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p release-assets

          # Move todos os pacotes das subpastas de artefatos para release-assets
          find all-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-assets/ \;

          # Executa o gerador único de manifestos e checksums com rastreabilidade de commit
          COMMIT_SHA="${{ github.sha }}"
          [ -z "$COMMIT_SHA" ] && COMMIT_SHA=$(git rev-parse HEAD)

          python3 scripts/generate_release_manifests.py \
            --version "$VERSION" \
            --commit "$COMMIT_SHA" \
            --artifacts-dir release-assets \
            --output-dir release-assets \
            --repo-root .

          # Exibe o conteúdo de SHA256SUMS.txt, metadata e manifestos atualizados
          echo "=== release-metadata.json ==="
          cat release-assets/release-metadata.json
          echo "=== SHA256SUMS.txt ==="
          cat release-assets/SHA256SUMS.txt
          echo "=== fastfile.json (Scoop) ==="
          cat release-assets/fastfile.json
          echo "=== fastfile.yaml (WinGet) ==="
          cat release-assets/fastfile.yaml

      # Proveniência verificável (SLSA): prova que cada arquivo foi construído por este workflow, neste
      # commit. Não exige certificado. Verificação: `gh attestation verify <arquivo> -R fabiomotta0311/fastfile`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.exe
            release-assets/SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: FastFile ${{ needs.get-version.outputs.tag }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.exe
            release-assets/release-metadata.json
            release-assets/SHA256SUMS.txt
            release-assets/fastfile.json
            release-assets/fastfile.yaml
            release-assets/fastfile.rb
          generate_release_notes: true
          draft: false
          prerelease: false
