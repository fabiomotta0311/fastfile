name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fastfile-linux-x86_64.tar.gz
            bin_ff: target/x86_64-unknown-linux-gnu/release/ff
            bin_fastfile: target/x86_64-unknown-linux-gnu/release/fastfile
            use_tar: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: fastfile-windows-x86_64.zip
            bin_ff: target/x86_64-pc-windows-msvc/release/ff.exe
            bin_fastfile: target/x86_64-pc-windows-msvc/release/fastfile.exe
            use_tar: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Linux)
        if: matrix.use_tar
        run: |
          tar -czf ${{ matrix.artifact_name }} \
            -C target/${{ matrix.target }}/release ff fastfile

      - name: Package artifacts (Windows)
        if: "!matrix.use_tar"
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/ff.exe, target/${{ matrix.target }}/release/fastfile.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */*.tar.gz
            */*.zip
          generate_release_notes: true
