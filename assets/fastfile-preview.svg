<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Active Tab Gradient -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Diff Highlight Colors -->
    <linearGradient id="diffAdd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="winShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="windowClip">
      <rect x="20" y="20" width="960" height="520" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- App Window Container with Shadow -->
  <g filter="url(#winShadow)">
    <rect x="20" y="20" width="960" height="520" rx="10" ry="10" fill="url(#bgGrad)" stroke="#2d3142" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#windowClip)">
    <!-- 1. Window Title Bar -->
    <rect x="20" y="20" width="960" height="34" fill="#13151f" stroke="#222533" stroke-width="1"/>
    
    <!-- Window Controls (Windows 11 style) -->
    <circle cx="42" cy="37" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="58" cy="37" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="74" cy="37" r="5" fill="#10b981" opacity="0.85"/>

    <text x="500" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      ⚡ FastFile — Busca Instantânea, Prévia com Realce, Diff e Treemap
    </text>

    <!-- 2. Main Search Bar & Top Navigation -->
    <rect x="20" y="54" width="960" height="58" fill="#161822"/>

    <!-- Search Input Box -->
    <rect x="36" y="65" width="760" height="36" rx="6" fill="#1f2333" stroke="#373d57" stroke-width="1"/>
    
    <!-- Search Icon (Flash / Lightning) -->
    <path d="M50 75 L58 75 L54 83 L61 83 L49 93 L52 85 L47 85 Z" fill="#818cf8"/>
    
    <!-- Search Query Text with Caret -->
    <text x="70" y="88" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">fastfile</text>
    <line x1="120" y1="74" x2="120" y2="92" stroke="#818cf8" stroke-width="1.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- Compare Button -->
    <rect x="810" y="65" width="154" height="36" rx="6" fill="#24293d" stroke="#373d57" stroke-width="1"/>
    <text x="887" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Comparar (2)</text>

    <!-- 3. Sub-header Navigation Tabs & Quick Filters -->
    <rect x="20" y="112" width="960" height="42" fill="#13151f" stroke="#222533" stroke-width="1"/>
    
    <!-- Main Tabs -->
    <!-- Tab 1: Resultados (Active) -->
    <rect x="36" y="119" width="105" height="28" rx="5" fill="url(#tabGrad)"/>
    <text x="88" y="137" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      🔍 Resultados
    </text>

    <!-- Tab 2: Treemap de Uso -->
    <rect x="148" y="119" width="125" height="28" rx="5" fill="#1f2333" stroke="#2d3247" stroke-width="1"/>
    <text x="210" y="137" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      📊 Treemap de Uso
    </text>

    <!-- Tab 3: Diff Lado a Lado -->
    <rect x="280" y="119" width="130" height="28" rx="5" fill="#1f2333" stroke="#2d3247" stroke-width="1"/>
    <text x="345" y="137" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      ⚖️ Diff Lado a Lado
    </text>

    <!-- Divider -->
    <line x1="422" y1="123" x2="422" y2="143" stroke="#33384f" stroke-width="1.5"/>

    <!-- Category Filter Pills -->
    <rect x="434" y="121" width="55" height="24" rx="12" fill="#4f46e5"/>
    <text x="461" y="137" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Todos</text>

    <rect x="496" y="121" width="58" height="24" rx="12" fill="#1e2233"/>
    <text x="525" y="137" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Código</text>

    <rect x="561" y="121" width="85" height="24" rx="12" fill="#1e2233"/>
    <text x="603" y="137" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Documentos</text>

    <rect x="653" y="121" width="50" height="24" rx="12" fill="#1e2233"/>
    <text x="678" y="137" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Mídia</text>

    <rect x="710" y="121" width="70" height="24" rx="12" fill="#1e2233"/>
    <text x="745" y="137" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">&gt; 100 MB</text>

    <!-- Preview Toggle Button -->
    <rect x="866" y="119" width="98" height="28" rx="5" fill="#24293d" stroke="#373d57" stroke-width="1"/>
    <text x="915" y="137" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ocultar Prévia</text>

    <!-- 4. Main Body: Split View (Results List + Preview Pane) -->
    
    <!-- LEFT PANEL: Virtualized Table (width 510px) -->
    <g transform="translate(20, 154)">
      <!-- Table Header -->
      <rect x="0" y="0" width="510" height="28" fill="#181a24" stroke="#222533" stroke-width="1"/>
      <text x="16" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">NOME</text>
      <text x="210" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TAMANHO</text>
      <text x="290" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CAMINHO</text>

      <!-- Row 1: Selected Item (fastfile.rs) -->
      <rect x="0" y="28" width="510" height="34" fill="#2a3048"/>
      <text x="16" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🦀 fastfile.rs</text>
      <text x="210" y="50" fill="#a5b4fc" font-family="'Cascadia Code', Consolas, monospace" font-size="11">24.8 KB</text>
      <text x="290" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">crates/ff-cli/src/</text>

      <!-- Row 2: Cargo.toml -->
      <rect x="0" y="62" width="510" height="34" fill="#151722"/>
      <text x="16" y="84" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">⚙️ Cargo.toml</text>
      <text x="210" y="84" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">3.2 KB</text>
      <text x="290" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">C:/Projects/fastfile/</text>

      <!-- Row 3: index.rs -->
      <rect x="0" y="96" width="510" height="34" fill="#181a24"/>
      <text x="16" y="118" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🦀 index_soa.rs</text>
      <text x="210" y="118" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">48.1 KB</text>
      <text x="290" y="118" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">crates/ff-index/src/</text>

      <!-- Row 4: mcp_server.rs -->
      <rect x="0" y="130" width="510" height="34" fill="#151722"/>
      <text x="16" y="152" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🤖 mcp_server.rs</text>
      <text x="210" y="152" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">19.4 KB</text>
      <text x="290" y="152" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">crates/ff-mcp/src/</text>

      <!-- Row 5: diff_engine.rs -->
      <rect x="0" y="164" width="510" height="34" fill="#181a24"/>
      <text x="16" y="186" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">⚖️ diff_engine.rs</text>
      <text x="210" y="186" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">32.6 KB</text>
      <text x="290" y="186" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">crates/ff-diff/src/</text>

      <!-- Row 6: treemap_squarified.rs -->
      <rect x="0" y="198" width="510" height="34" fill="#151722"/>
      <text x="16" y="220" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">📊 treemap.rs</text>
      <text x="210" y="220" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">14.2 KB</text>
      <text x="290" y="220" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">crates/ff-ui/src/</text>

      <!-- Row 7: fastfile.exe -->
      <rect x="0" y="232" width="510" height="34" fill="#181a24"/>
      <text x="16" y="254" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">⚡ fastfile.exe</text>
      <text x="210" y="254" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">22.1 MB</text>
      <text x="290" y="254" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">target/release/</text>

      <!-- Row 8: architecture.md -->
      <rect x="0" y="266" width="510" height="34" fill="#151722"/>
      <text x="16" y="288" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">📝 ARQUITETURA.md</text>
      <text x="210" y="288" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">18.5 KB</text>
      <text x="290" y="288" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">docs/</text>

      <!-- Row 9: usn_journal.rs -->
      <rect x="0" y="300" width="510" height="30" fill="#181a24"/>
      <text x="16" y="320" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🪟 usn_watch.rs</text>
      <text x="210" y="320" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">11.0 KB</text>
      <text x="290" y="320" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">crates/ff-index/src/</text>
    </g>

    <!-- RIGHT PANEL: Syntax Highlighted Preview Pane (width 450px) -->
    <g transform="translate(530, 154)">
      <!-- Panel Container Background -->
      <rect x="0" y="0" width="450" height="330" fill="#11131a" stroke="#222533" stroke-width="1"/>

      <!-- Preview Header -->
      <rect x="0" y="0" width="450" height="36" fill="#161822" stroke="#222533" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#818cf8"/>
      <text x="28" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Pré-visualização</text>
      <text x="135" y="22" fill="#818cf8" font-family="'Cascadia Code', Consolas, monospace" font-size="12">fastfile.rs</text>
      
      <!-- Quick Filter Inside File -->
      <rect x="270" y="6" width="168" height="24" rx="4" fill="#1f2333" stroke="#2d3247" stroke-width="1"/>
      <text x="280" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Filtrar no arquivo...</text>

      <!-- Code Editor View with Syntax Highlight -->
      <g transform="translate(10, 48)">
        <!-- Line Numbers -->
        <text x="15" y="16" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">1</text>
        <text x="15" y="36" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">2</text>
        <text x="15" y="56" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">3</text>
        <text x="15" y="76" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">4</text>
        <text x="15" y="96" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">5</text>
        <text x="15" y="116" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">6</text>
        <text x="15" y="136" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">7</text>
        <text x="15" y="156" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">8</text>
        <text x="15" y="176" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">9</text>
        <text x="15" y="196" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">10</text>
        <text x="15" y="216" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">11</text>
        <text x="15" y="236" fill="#475569" font-family="'Cascadia Code', Consolas, monospace" font-size="11" text-anchor="end">12</text>

        <!-- Divider Line -->
        <line x1="26" y1="0" x2="26" y2="260" stroke="#1f2333" stroke-width="1"/>

        <!-- Code Lines -->
        <!-- Line 1: Comment -->
        <text x="36" y="16" fill="#64748b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">// FastFile — Busca instantânea e motor de arquivos</text>

        <!-- Line 2: Attributes -->
        <text x="36" y="36" fill="#f59e0b" font-family="'Cascadia Code', Consolas, monospace" font-size="11">#[derive(Debug, Clone, Serialize)]</text>

        <!-- Line 3: pub struct -->
        <text x="36" y="56" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
          <tspan fill="#ec4899">pub struct </tspan>
          <tspan fill="#38bdf8">FastFileQuery </tspan>
          <tspan fill="#cbd5e1">{</tspan>
        </text>

        <!-- Line 4: field -->
        <text x="56" y="76" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
          <tspan fill="#ec4899">pub </tspan>
          <tspan fill="#f8fafc">pattern: </tspan>
          <tspan fill="#38bdf8">String</tspan>
          <tspan fill="#cbd5e1">,</tspan>
        </text>

        <!-- Line 5: field -->
        <text x="56" y="96" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
          <tspan fill="#ec4899">pub </tspan>
          <tspan fill="#f8fafc">token_budget: </tspan>
          <tspan fill="#38bdf8">Option&lt;usize&gt;</tspan>
          <tspan fill="#cbd5e1">,</tspan>
        </text>

        <!-- Line 6: field -->
        <text x="56" y="116" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
          <tspan fill="#ec4899">pub </tspan>
          <tspan fill="#f8fafc">secret_masking: </tspan>
          <tspan fill="#38bdf8">bool</tspan>
          <tspan fill="#cbd5e1">,</tspan>
        </text>

        <!-- Line 7: struct close -->
        <text x="36" y="136" fill="#cbd5e1" font-family="'Cascadia Code', Consolas, monospace" font-size="11">}</text>

        <!-- Line 8: impl -->
        <text x="36" y="156" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
          <tspan fill="#ec4899">impl </tspan>
          <tspan fill="#38bdf8">FastFileQuery </tspan>
          <tspan fill="#cbd5e1">{</tspan>
        </text>

        <!-- Line 9: pub fn -->
        <text x="56" y="176" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
          <tspan fill="#ec4899">pub fn </tspan>
          <tspan fill="#34d399">execute_fast</tspan>
          <tspan fill="#cbd5e1">(&amp;self) -&gt; </tspan>
          <tspan fill="#38bdf8">QueryResult </tspan>
          <tspan fill="#cbd5e1">{</tspan>
        </text>

        <!-- Line 10: Call -->
        <text x="76" y="196" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
          <tspan fill="#38bdf8">IndexEngine</tspan>
          <tspan fill="#cbd5e1">::</tspan>
          <tspan fill="#34d399">search_mmap</tspan>
          <tspan fill="#cbd5e1">(&amp;self.pattern)</tspan>
        </text>

        <!-- Line 11: End fn -->
        <text x="56" y="216" fill="#cbd5e1" font-family="'Cascadia Code', Consolas, monospace" font-size="11">}</text>

        <!-- Line 12: End impl -->
        <text x="36" y="236" fill="#cbd5e1" font-family="'Cascadia Code', Consolas, monospace" font-size="11">}</text>
      </g>
    </g>

    <!-- 5. Bottom Status Bar -->
    <rect x="20" y="504" width="960" height="36" fill="#0d0f15" stroke="#222533" stroke-width="1"/>
    
    <!-- Status Elements -->
    <circle cx="38" cy="522" r="4.5" fill="#10b981"/>
    <text x="50" y="526" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Varredura Local Concluída</text>
    
    <text x="210" y="526" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <tspan fill="#94a3b8" font-weight="600">839</tspan> resultados de <tspan fill="#94a3b8" font-weight="600">382.138</tspan> arquivos indexados
    </text>

    <text x="910" y="526" fill="#818cf8" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="600" text-anchor="end">
      ⚡ 1.8 ms
    </text>
  </g>
</svg>
