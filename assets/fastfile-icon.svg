<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="50%" stop-color="#151824"/>
      <stop offset="100%" stop-color="#1c2033"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Document Card Gradient -->
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23283e"/>
      <stop offset="100%" stop-color="#161928"/>
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient (Electric Cyan to Neon Purple) -->
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Clip Path for Document Corner Fold -->
    <clipPath id="docClip">
      <path d="M128 72 L320 72 L384 136 L384 440 L128 440 Z"/>
    </clipPath>
  </defs>

  <!-- 1. Background Squircle with Drop Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="6" filter="url(#shadow)"/>

  <!-- 2. Ambient Glow Center -->
  <circle cx="256" cy="256" r="140" fill="#4f46e5" opacity="0.18" filter="blur(36px)"/>

  <!-- 3. Document / File Silhouette -->
  <g filter="url(#shadow)">
    <!-- Main Sheet Body -->
    <path d="M136 84 C136 76 142 70 150 70 L316 70 L376 130 L376 428 C376 436 370 442 362 442 L150 442 C142 442 136 436 136 428 Z" fill="url(#docGradient)" stroke="#373d5e" stroke-width="3"/>
    
    <!-- Top-Right Fold Flap -->
    <path d="M316 70 L316 122 C316 126 320 130 324 130 L376 130 Z" fill="url(#foldGradient)" stroke="#4f46e5" stroke-width="2"/>

    <!-- Subtle Content Lines Inside Document -->
    <rect x="172" y="160" width="80" height="10" rx="5" fill="#475569" opacity="0.5"/>
    <rect x="172" y="190" width="120" height="10" rx="5" fill="#475569" opacity="0.4"/>
    <rect x="172" y="220" width="90" height="10" rx="5" fill="#475569" opacity="0.3"/>
  </g>

  <!-- 4. Speed / Index Pulse Rings (Search Lens & Speed Motif) -->
  <circle cx="256" cy="270" r="105" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.25" stroke-dasharray="12 8"/>
  <circle cx="256" cy="270" r="75" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>

  <!-- 5. Central Fast Lightning Bolt (Signature Element) -->
  <!-- Dramatic, sharp, powerful bolt cutting across -->
  <g filter="url(#glow)">
    <path d="M286 96 L180 262 L254 262 L226 416 L332 250 L258 250 Z" fill="url(#boltGradient)"/>
  </g>

  <!-- Specular Highlight Core -->
  <path d="M280 110 L195 258 L250 258 L232 390 L318 254 L262 254 Z" fill="#ffffff" opacity="0.35"/>
</svg>
