<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="auto">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13"/>
      <stop offset="50%" stop-color="#111422"/>
      <stop offset="100%" stop-color="#18172b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" rx="12" fill="url(#bannerBg)" stroke="#222538" stroke-width="1.5"/>

  <!-- Glowing Accent Spot -->
  <circle cx="120" cy="100" r="80" fill="#4f46e5" opacity="0.15" filter="blur(30px)"/>

  <!-- Logo Icon -->
  <g transform="translate(60, 45)">
    <rect width="90" height="90" rx="20" fill="#1b1e2e" stroke="#373d5a" stroke-width="1.5"/>
    <!-- Lightning Bolt -->
    <path d="M48 16 L28 48 L46 48 L38 76 L66 42 L48 42 Z" fill="url(#boltGrad)"/>
  </g>

  <!-- Title & Tagline -->
  <text x="175" y="90" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    FastFile
    <tspan fill="#6366f1" font-size="30" font-weight="400"> · </tspan>
    <tspan fill="#a5b4fc" font-family="'Cascadia Code', monospace" font-size="28" font-weight="600">ff</tspan>
  </text>

  <text x="175" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    O canivete suíço de arquivos definitivo: busca instantânea (≈13 ms em 4 mi de arquivos), prévia, diff e treemap.
  </text>
  <text x="175" y="148" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
    Desenhado para humanos no Windows/Linux &amp; otimizado com servidor MCP nativo para Agentes de IA.
  </text>
</svg>
