<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#12131a"/>
    </linearGradient>
    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="borderGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Busca Ultrarrápida -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="230" height="220" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad1)" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="18" fill="#312e81"/>
    <text x="36" y="44" font-size="18" text-anchor="middle">⚡</text>
    
    <text x="20" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Busca &amp; Prévia instantâneas</text>
    <text x="20" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" line-height="1.4">
      <tspan x="20" dy="0">Milhões de arquivos indexados</tspan>
      <tspan x="20" dy="18">via MFT e USN Journal.</tspan>
      <tspan x="20" dy="18">Pré-visualização imediata por</tspan>
      <tspan x="20" dy="18">memória mapeada sem travar.</tspan>
    </text>
    
    <rect x="20" y="180" width="115" height="22" rx="4" fill="#1e1b4b"/>
    <text x="77" y="195" fill="#a5b4fc" font-family="'Cascadia Code', monospace" font-size="10" font-weight="600" text-anchor="middle">≈13 ms em 4 mi</text>
  </g>

  <!-- Card 2: Treemap de Disco -->
  <g transform="translate(255, 10)">
    <rect x="0" y="0" width="230" height="220" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad2)" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="18" fill="#064e3b"/>
    <text x="36" y="44" font-size="18" text-anchor="middle">📊</text>
    
    <text x="20" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Treemap de Disco</text>
    <text x="20" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="20" dy="0">Substitui o WizTree:</tspan>
      <tspan x="20" dy="18">mapa proporcional squarified</tspan>
      <tspan x="20" dy="18">com drill-down interativo</tspan>
      <tspan x="20" dy="18">assíncrono em background.</tspan>
    </text>
    
    <rect x="20" y="180" width="125" height="22" rx="4" fill="#022c22"/>
    <text x="82" y="195" fill="#6ee7b7" font-family="'Cascadia Code', monospace" font-size="10" font-weight="600" text-anchor="middle">Background async</text>
  </g>

  <!-- Card 3: Diff Lado a Lado -->
  <g transform="translate(500, 10)">
    <rect x="0" y="0" width="230" height="220" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad3)" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="18" fill="#451a03"/>
    <text x="36" y="44" font-size="18" text-anchor="middle">⚖️</text>
    
    <text x="20" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Diff Lado a Lado</text>
    <text x="20" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="20" dy="0">Comparador integrado estilo</tspan>
      <tspan x="20" dy="18">WinMerge com Location Pane,</tspan>
      <tspan x="20" dy="18">realce intra-linha e atalho</tspan>
      <tspan x="20" dy="18">via Ctrl+clique nos arquivos.</tspan>
    </text>
    
    <rect x="20" y="180" width="120" height="22" rx="4" fill="#451a03"/>
    <text x="80" y="195" fill="#fcd34d" font-family="'Cascadia Code', monospace" font-size="10" font-weight="600" text-anchor="middle">Location Pane + Diff</text>
  </g>

  <!-- Card 4: 1ª Classe para IA -->
  <g transform="translate(745, 10)">
    <rect x="0" y="0" width="245" height="220" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad4)" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="18" fill="#500724"/>
    <text x="36" y="44" font-size="18" text-anchor="middle">🤖</text>
    
    <text x="20" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1ª Classe para IA</text>
    <text x="20" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="20" dy="0">Servidor MCP integrado e</tspan>
      <tspan x="20" dy="18">JSON versionado ff/1 com</tspan>
      <tspan x="20" dy="18">limite de tokens (--budget)</tspan>
      <tspan x="20" dy="18">e proteção ativa de segredos.</tspan>
    </text>
    
    <rect x="20" y="180" width="135" height="22" rx="4" fill="#500724"/>
    <text x="87" y="195" fill="#f472b6" font-family="'Cascadia Code', monospace" font-size="10" font-weight="600" text-anchor="middle">MCP + 70% menos tokens</text>
  </g>
</svg>
