[package]
name = "ff-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Interface gráfica desktop nativa egui para o FastFile (§4 e Issue #13)"

[[bin]]
name = "ff-ui"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
ff-diff = { path = "../ff-diff" }
ff-index = { path = "../ff-index" }
ff-indexer = { path = "../ff-indexer" }
ff-preview = { path = "../ff-preview" }
ff-search = { path = "../ff-search" }
ff-size = { path = "../ff-size" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
