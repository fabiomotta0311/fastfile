[package]
name = "ff-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Interface gráfica desktop nativa egui para o FastFile (§4 e Issue #13)"

[[bin]]
name = "fastfile"
path = "src/main.rs"

[[bin]]
name = "ff-ui"
path = "src/bin/ff-ui.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
ff-cli = { path = "../ff-cli" }
ff-diff = { path = "../ff-diff" }
ff-index = { path = "../ff-index" }
ff-indexer = { path = "../ff-indexer" }
ff-preview = { path = "../ff-preview" }
ff-search = { path = "../ff-search" }
ff-size = { path = "../ff-size" }
rfd = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
