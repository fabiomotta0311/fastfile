[package]
name = "ff-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "ff"

[[bin]]
name = "ff"
path = "src/bin/ff.rs"

[[bin]]
name = "fastfile"
path = "src/bin/fastfile.rs"

[dependencies]
clap = { workspace = true }
ff-content = { path = "../ff-content" }
ff-diff = { path = "../ff-diff" }
ff-index = { path = "../ff-index" }
ff-search = { path = "../ff-search" }
ff-size = { path = "../ff-size" }
ff-sym = { path = "../ff-sym" }
ignore = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
