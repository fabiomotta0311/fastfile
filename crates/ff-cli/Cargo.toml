[package]
name = "ff-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "ff"

[[bin]]
name = "ff"
path = "src/bin/ff.rs"

[dependencies]
cap-fs-ext = "3.4.5"
cap-std = "3.4.5"
clap = { workspace = true }
ff-content = { workspace = true }
ff-diff = { workspace = true }
ff-index = { workspace = true }
ff-indexer = { workspace = true }
ff-search = { workspace = true }
ff-size = { workspace = true }
ff-sym = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
toml = "0.5.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
