[workspace]
resolver = "2"
members = [
    "crates/ff-index",
    "crates/ff-search",
    "crates/ff-size",
    "crates/ff-diff",
    "crates/ff-content",
    "crates/ff-sym",
    "crates/ff-cli",
    "crates/ff-indexer",
    "crates/ff-preview",
    "crates/ff-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fabio Motta"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = "0.31"
egui = "0.31"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
memchr = "2.7"
memmap2 = "0.9"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { version = "2.7", features = ["inline", "bytes"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
