[workspace]
resolver = "2"
members = [
    "crates/ff-index",
    "crates/ff-search",
    "crates/ff-size",
    "crates/ff-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fabio Motta"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
memchr = "2.7"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
