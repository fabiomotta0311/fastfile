[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/ff-index",
    "crates/ff-search",
    "crates/ff-size",
    "crates/ff-diff",
    "crates/ff-content",
    "crates/ff-sym",
    "crates/ff-cli",
    "crates/ff-indexer",
    "crates/ff-preview",
    "crates/ff-ui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Fabio Motta"]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Crates internos: versão explícita (exigida pelo `cargo publish` e pelo `cargo-deny`, que não
# aceita dependência só por caminho em crate publicável). Atualize junto com `workspace.package`.
ff-index = { path = "crates/ff-index", version = "0.2.0" }
ff-search = { path = "crates/ff-search", version = "0.2.0" }
ff-size = { path = "crates/ff-size", version = "0.2.0" }
ff-diff = { path = "crates/ff-diff", version = "0.2.0" }
ff-content = { path = "crates/ff-content", version = "0.2.0" }
ff-sym = { path = "crates/ff-sym", version = "0.2.0" }
ff-cli = { path = "crates/ff-cli", version = "0.2.0" }
ff-indexer = { path = "crates/ff-indexer", version = "0.2.0" }
ff-preview = { path = "crates/ff-preview", version = "0.2.0" }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.31"
egui = "0.31"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
memchr = "2.7"
memmap2 = "0.9"
pdf-extract = "0.12.1"
quick-xml = "0.42"
rayon = "1.10"
regex = "1.11"
regex-syntax = "0.8"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { version = "2.7", features = ["inline", "bytes"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
